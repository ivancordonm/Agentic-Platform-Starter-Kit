schema_version: 1
workflow:
  name: generic-demo
  type: graph
  start: analyze
  limits:
    max_steps: 10
    timeout_seconds: 120
    max_concurrency: 3
  nodes:
    analyze:
      type: agent
      agent: analyzer
    review:
      type: agent
      agent: reviewer
    finalize:
      type: agent
      agent: finalizer
  transitions:
    - from: analyze
      to: review
    - from: review
      to: finalize
    - from: finalize
      to: END
  output:
    select: results.finalize.output
