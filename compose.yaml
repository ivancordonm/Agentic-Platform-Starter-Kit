services:
  api:
    build: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PLATFORM_API_TOKEN: ${PLATFORM_API_TOKEN:-}
      PROJECT_DIR: /app/project
      RUN_DB_PATH: /app/data/runs.sqlite3
    volumes:
      - ./project:/app/project:ro
      - run_data:/app/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "app/ui/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      API_BASE_URL: http://api:8000
      PLATFORM_API_TOKEN: ${PLATFORM_API_TOKEN:-}
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  run_data:
